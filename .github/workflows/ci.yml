name: CI

on:
  push:
    branches: [main, v2-advanced, v3-*]
  pull_request:
    branches: [main, v2-advanced]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        env:
          LLM_PROVIDER: mock
          HN_ENABLED: "false"
          REDDIT_ENABLED: "false"
          ARXIV_ENABLED: "false"
          GITHUB_TRENDING_ENABLED: "false"
        run: pytest -v --cov=modules --cov-report=term

      - name: Smoke test (dry-run, mock LLM, no network sources)
        env:
          LLM_PROVIDER: mock
          HN_ENABLED: "false"
          REDDIT_ENABLED: "false"
          ARXIV_ENABLED: "false"
          GITHUB_TRENDING_ENABLED: "false"
          RSS_FEEDS: ""
        run: |
          # Skip the network fetch entirely; we're proving imports + pipeline structure.
          python -c "from modules.editorial import run_editorial; \
                     r = run_editorial([{'title':'t','summary':'s','url':'https://ex.com/1','source':'x','score':1.0}]); \
                     assert r['body'] and r['subject']; print('Smoke OK')"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t newsletter-ai:ci .
      - name: Container import sanity
        run: |
          docker run --rm -e LLM_PROVIDER=mock newsletter-ai:ci \
            python -c "import main, webui; from modules import editorial, archive, cluster; print('imports OK')"
